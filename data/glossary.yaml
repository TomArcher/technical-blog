reaction-time:
  term: "Reaction time"
  definition: "The elapsed time between perceiving an event and beginning a physical response to it."


regularization:
  term: "Regularization"
  definition: "Techniques that discourage a model from fitting training data too narrowly, improving its ability to generalize to unseen data."


residual-connection:
  term: "Residual connection"
  definition: "A shortcut connection that adds a layer's input to its output, helping information and gradients flow through deep neural networks."


residual-stream:
  term: "Residual stream"
  definition: "The evolving vector representation passed through transformer layers and updated by components such as attention and feedforward networks."


retrieval-augmented-generation:
  term: "Retrieval-Augmented Generation (RAG)"
  definition: "A technique that retrieves relevant information from an external source and supplies it as context to a generative model."


rmsprop:
  term: "RMSProp"
  definition: "An optimization algorithm that adjusts parameter learning rates using a moving average of squared gradients."


root:
  term: "Root"
  definition: "A value of a variable that makes a mathematical function or equation equal to zero."


rwkv:
  term: "RWKV"
  definition: "A neural network architecture that combines characteristics of recurrent neural networks and transformers while supporting linear-time sequence processing."


saddle-point:
  term: "Saddle point"
  definition: "A point where the gradient is zero but which is not a local minimum or maximum because the function rises in some directions and falls in others."


sampling:
  term: "Sampling"
  definition: "The process of selecting an outcome randomly according to a probability distribution, such as choosing the next token during language generation."


scaled-dot-product-attention:
  term: "Scaled dot-product attention"
  definition: "An attention mechanism that compares queries with keys using dot products, scales the resulting scores by the square root of the key dimension, applies softmax, and uses the resulting weights to combine values."


self-attention:
  term: "Self-attention"
  definition: "An attention mechanism in which tokens in a sequence determine the relevance of other tokens in that same sequence."


semantic-retrieval:
  term: "Semantic retrieval"
  definition: "Retrieval based on similarity of meaning rather than exact matching of words or phrases."


sentencepiece:
  term: "SentencePiece"
  definition: "A language-independent tokenization system that learns subword units directly from raw text without requiring pre-tokenization into words."


sequence-length:
  term: "Sequence length"
  definition: "The number of tokens or other units in an input or output sequence."


session-token:
  term: "Session token"
  definition: "A value used to identify and associate a client with an authenticated or otherwise established application session."


set-theory:
  term: "Set theory"
  definition: "The branch of mathematics that studies collections of objects and operations such as union, intersection, complement, and membership."


sha-1:
  term: "SHA-1"
  definition: "A cryptographic hash function that produces a 160-bit hash and is now considered insecure because practical collision attacks have been demonstrated."


sharding:
  term: "Sharding"
  definition: "A database partitioning technique that distributes portions of a dataset across multiple independent servers or database instances."


shortwave-radiation:
  term: "Shortwave radiation"
  definition: "Electromagnetic radiation at relatively short wavelengths, including most of the solar energy reaching Earth's surface."


simulated-annealing:
  term: "Simulated annealing"
  definition: "A probabilistic optimization algorithm that sometimes accepts worse intermediate solutions to escape local optima while gradually reducing that behavior during the search."


simulation:
  term: "Simulation"
  definition: "The use of a computational model to imitate the behavior of a system so that its outcomes can be explored or analyzed."


singular-value-decomposition:
  term: "Singular value decomposition (SVD)"
  definition: "A matrix factorization technique that decomposes a matrix into components representing important directions and their relative strengths."


sliding-window-attention:
  term: "Sliding window attention"
  definition: "An attention pattern that restricts each token to attending to a limited neighborhood of nearby tokens rather than the entire sequence."


softmax:
  term: "Softmax"
  definition: "A function that converts a set of numerical scores into nonnegative values that sum to one, allowing them to be interpreted as a probability distribution."


solow-residual:
  term: "Solow residual"
  definition: "The portion of economic output growth not explained by measured growth in labor and capital, commonly associated with changes in productivity or technology."


specific-heat:
  term: "Specific heat"
  definition: "The amount of energy required to raise the temperature of a unit mass of a substance by one degree."


standard-deviation:
  term: "Standard deviation"
  definition: "A measure of spread equal to the square root of variance and expressed in the same units as the measured values."


stateless:
  term: "Stateless"
  definition: "Describes a system in which each request is handled independently without retaining information from previous requests."


static-analysis:
  term: "Static analysis"
  definition: "The examination of source code for properties, errors, or vulnerabilities without executing the program."


stefan-boltzmann-law:
  term: "Stefan-Boltzmann law"
  definition: "A physical law stating that the thermal radiation emitted by an idealized surface is proportional to the fourth power of its absolute temperature."


stochastic:
  term: "Stochastic"
  definition: "Involving randomness or probability rather than producing a completely deterministic outcome."


stochastic-gradient-descent:
  term: "Stochastic gradient descent (SGD)"
  definition: "A gradient-based optimization method that estimates gradients from randomly selected training examples rather than the entire dataset."


stopping-distance:
  term: "Stopping distance"
  definition: "The total distance traveled from recognizing the need to stop until the object comes to rest, including both reaction and braking distance."


subword-tokenization:
  term: "Subword tokenization"
  definition: "A tokenization strategy that represents text using units larger than individual characters but often smaller than complete words."


surface-area:
  term: "Surface area"
  definition: "The total area of the exposed surfaces of a three-dimensional object."


symbolic-algebra:
  term: "Symbolic algebra"
  definition: "The manipulation of mathematical expressions containing symbols, including operations such as expansion, factoring, simplification, and equation solving."


symbolic-computation:
  term: "Symbolic computation"
  definition: "Mathematical computation that manipulates expressions and exact values symbolically rather than approximating them numerically."


syntax-semantics:
  term: "Syntax and semantics"
  definition: "Syntax defines the valid structure of expressions in a language, while semantics defines what those expressions mean."


temperature:
  term: "Temperature"
  definition: "A sampling parameter that rescales a model's logits before softmax, controlling how concentrated or spread out the resulting token probabilities are."


thermal-stratification:
  term: "Thermal stratification"
  definition: "The formation of layers within a fluid at different temperatures, often with warmer, less dense fluid above cooler, denser fluid."


thermocline:
  term: "Thermocline"
  definition: "A layer in a body of water where temperature changes rapidly with depth, separating warmer surface water from colder deep water."


thermodynamics:
  term: "Thermodynamics"
  definition: "The branch of physics concerned with energy, heat, work, temperature, and the ways energy is transferred and transformed."


thought-experiment:
  term: "Thought experiment"
  definition: "A hypothetical scenario used to explore the consequences of assumptions or ideas through reasoning rather than direct experimentation."


three-second-rule:
  term: "Three-second rule"
  definition: "A driving guideline that recommends maintaining at least three seconds of travel time between your vehicle and the vehicle ahead."


time-headway:
  term: "Time headway"
  definition: "The time interval between two moving vehicles passing the same point, commonly used to express following distance independently of speed."


token:
  term: "Token"
  definition: "A unit of text processed by a language model, such as a word, part of a word, punctuation mark, or other character sequence."


token-id:
  term: "Token ID"
  definition: "The numerical identifier assigned to a token in a tokenizer's vocabulary."


tokenization:
  term: "Tokenization"
  definition: "The process of dividing input into tokens that a model can represent and process numerically."


tool-use:
  term: "Tool use"
  definition: "The ability of a model to request actions from external systems, such as web search, code execution, calculators, databases, or APIs, and then reason over the returned results."


top-k:
  term: "Top-k"
  definition: "The k highest-ranked results selected from a larger set, such as the most relevant document chunks returned by a retrieval system."


top-k-sampling:
  term: "Top-k sampling"
  definition: "A token-sampling strategy that restricts the model's next-token choices to the k tokens with the highest probabilities."


top-p:
  term: "Top-p"
  definition: "A sampling parameter that restricts token selection to the smallest set of highest-probability tokens whose cumulative probability reaches a specified threshold."


top-p-sampling:
  term: "Top-p (nucleus) sampling"
  definition: "A token-sampling strategy that selects from the smallest set of highest-probability tokens whose cumulative probability reaches a specified threshold p."


total-factor-productivity:
  term: "Total Factor Productivity (TFP)"
  definition: "An economic measure of the portion of output growth that cannot be explained by increases in measured inputs such as labor and capital."


transformer:
  term: "Transformer"
  definition: "A neural network architecture built around attention mechanisms for processing relationships among elements of a sequence."


trigonometry:
  term: "Trigonometry"
  definition: "The branch of mathematics concerned with relationships among angles and lengths, commonly expressed using functions such as sine, cosine, and tangent."


utf-8:
  term: "UTF-8"
  definition: "A variable-length Unicode character encoding that represents text using sequences of one to four bytes."


uuid-v1:
  term: "UUID version 1"
  definition: "A UUID format generated primarily from a timestamp and node identifier rather than random bits."


uuid-v4:
  term: "UUID version 4"
  definition: "A 128-bit UUID format in which 122 bits are randomly generated, providing an extremely large space of possible identifiers."


value:
  term: "Value"
  definition: "In attention, a learned vector containing the information contributed by a token after its relevance has been determined."


vanishing-gradient:
  term: "Vanishing gradient"
  definition: "A training problem in which gradients become extremely small as they propagate backward through a deep neural network, slowing or preventing learning in earlier layers."


variance:
  term: "Variance"
  definition: "A measure of how widely numerical values are spread around their mean, equal to the average squared deviation from that mean."


vector:
  term: "Vector"
  definition: "An ordered list of numerical values that can represent an object, direction, or position in a multidimensional space."


vector-database:
  term: "Vector database"
  definition: "A database designed to store and search high-dimensional vectors, commonly used to retrieve items with embeddings similar to a query."


vector-norm:
  term: "Vector norm"
  definition: "A numerical measure of a vector's magnitude or length."


vector-projection:
  term: "Vector projection"
  definition: "The component of one vector that lies in the direction of another vector."


vectorization:
  term: "Vectorization"
  definition: "The technique of applying an operation to an entire array of values at once rather than processing individual elements with explicit loops."


velocity:
  term: "Velocity"
  definition: "A vector quantity describing both the speed and direction of an object's motion."


vocabulary:
  term: "Vocabulary"
  definition: "The complete set of tokens that a tokenizer can represent directly, with each token assigned a numerical identifier."


volume-utilization:
  term: "Volume utilization"
  definition: "The proportion of a container's available three-dimensional volume occupied by packed items."


warm-restarts:
  term: "Warm restarts"
  definition: "An optimization strategy that periodically raises the learning rate after it has decreased, allowing training to explore new regions of parameter space."


wordpiece:
  term: "WordPiece"
  definition: "A subword tokenization algorithm that builds a vocabulary of reusable word pieces and is used by models such as BERT."


working-memory:
  term: "Working memory"
  definition: "Short-term information kept immediately available for ongoing reasoning or processing rather than stored as durable long-term memory."

