- title: "The Cooperative Witness Problem"
  description: "A piece on the ways language models tend to accept and continue user premises rather than push back on them, and the training dynamics that produce that tendency. Follows naturally from Part 2 of Inside Attention, which sets up the function-class framing this piece depends on."

- title: "Pre-training vs. Post-training"
  description: "The distinction between the compute-heavy foundation training phase and the alignment phase that shapes model behavior (supervised fine-tuning, RLHF, DPO, Constitutional AI). One of the highest-confusion topics for readers new to the field and a natural companion to the cooperative witness piece."

- title: "Softmax and Cross-Entropy Loss"
  description: "A focused post on the connective tissue between probability and learning. Softmax as the operation that turns real numbers into distributions; cross-entropy as the loss that measures how well those distributions match the truth. Short, foundational, unlocks the probability layer."

- title: "The Feedforward Sublayer"
  description: "A standalone post on the FFN sublayer inside each transformer block: what it does, why it is often much larger than the attention sublayer, and what interpretability research has shown about the concepts stored there."

- title: "In-Context Learning"
  description: "How models adapt to patterns within a single prompt without parameter updates, and why induction heads (covered in Inside Attention Part 1) are part but not all of the mechanistic story."

- title: "Reasoning Models and Test-Time Compute"
  description: "The class of models that spend additional compute at inference time to improve their answers, and why this changes what 'capability' means."

- title: "Scaling Laws and Emergence"
  description: "The empirical relationships between compute, data, parameters, and capability, and where the sharp transitions in behavior come from."

- title: "A Mechanistic Interpretability Primer"
  description: "An introduction to the research program of reverse-engineering trained transformers, at the level of concrete circuits and features rather than high-level intuitions."