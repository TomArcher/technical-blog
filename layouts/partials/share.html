{{/* layouts/partials/share.html */}}
{{- $url := .Permalink -}}
{{- $title := cond (ne .Params.shareTitle "") .Params.shareTitle .Title -}}
{{- $u := $url | urlquery -}}
{{- $t := $title | urlquery -}}

<div class="share">
  <span class="share__label">Share:</span>
  <a class="share__btn" href="https://twitter.com/intent/tweet?url={{ $u }}&text={{ $t }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X">
    X
  </a>
  <a class="share__btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $u }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
    in
  </a>
  <a class="share__btn" href="https://www.facebook.com/sharer/sharer.php?u={{ $u }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook">
    f
  </a>
  <a class="share__btn" href="https://www.reddit.com/submit?url={{ $u }}&title={{ $t }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Reddit">
    r
  </a>
  <a class="share__btn" href="mailto:?subject={{ $t }}&body={{ $u }}" aria-label="Share via Email">
    @
  </a>

  <button class="share__btn share__btn--native" type="button" aria-label="Share">
    Share
  </button>
</div>

<script>
(function () {
  const btn = document.currentScript.previousElementSibling.querySelector('.share__btn--native');
  if (!btn || !navigator.share) { if (btn) btn.style.display = 'none'; return; }
  btn.addEventListener('click', async () => {
    try {
      await navigator.share({
        title: {{ printf "%q" $title }},
        url: {{ printf "%q" $url }}
      });
    } catch (_) {}
  });
})();
</script>
