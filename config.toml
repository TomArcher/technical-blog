baseURL = "https://tomarcher.io/"
languageCode = "en-us"
title = "Signal & Syntax"
theme = "mainroad"
ignoreFiles = ['^content/posts/.*/_private/']
googleAnalytics = "G-7ZV2PMS61P"

[pagination]
  pagerSize = 3

[params]
  readMore = true
  aboutShowAvatar = false
  avatar = "img/avatar.png"
  mainSections = ["posts"]
  description = "Tom Archer's technical blog"
  math = true
  opengraph = true
  twitter_cards = true
  schema = true

  # Short bio (first paragraph)
  bio = """
  I build platforms that frontier AI labs run on: training infrastructure, evaluation systems, internal tooling, model serving. The systems the researchers use, not the ones the customers see.
  
  For forty years I've built platforms, not applications. Every time I've been asked to ship a product, the product has turned out to be a system for generating products: a metaprogramming layer, a runtime, a configuration-driven engine that outlives the original feature request.
  
  The pattern shows across my career: Forms Express at AT&T, a four-layer dynamic runtime shipped for under $500K against a $2M consulting bid. VeriSign's first-ever customer self-service mobile activation system, which won the 2003 SUPERQuest Award. TAG at Microsoft, a production LLM orchestration platform that shipped nearly 100 Terraform articles by parsing XML templates, routing prompts to Azure OpenAI, and composing results with browser-driven Azure portal capture. Along the way: C++ MVP, 9 technology books, 100+ articles for .NET Programming Tips & Techniques, and helping run CodeGuru, the largest Windows developer community of its era.
  
  After 21 years at Microsoft, I'm now full-time on what's next: completing my Master's in Computer Science and publishing at Signal & Syntax, a technical blog where I work through the mathematics and engineering underneath the models: from gradient descent to inference-time behavior, from tokenization to training infrastructure.

  Connect with me on [LinkedIn](https://www.linkedin.com/in/tom-archer-dev/).
  """

  # Load a small custom CSS file for the "READ MORE" button and separators
  customCSS = ["css/extra.css"]

[taxonomies]
  category = "categories"
  learningPath = "learningPaths"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/"
    weight = 2
  [[menu.main]]
    name = "Roadmap"
    url  = "/posts/roadmap/"
    weight = 5
  [[menu.main]]
    name = "About"
    url  = "/about/"
    weight = 10
  [[menu.main]]
    #name = "Bio"
    name = "behind the code"
    url  = "/bio/"
    weight = 20

[params.social]
  github   = "https://github.com/tomarcher"
  linkedin = "https://www.linkedin.com/in/tom-archer-dev/"
  rss      = true

# Right sidebar widgets order:
[params.sidebar]
  home   = "right"
  list   = "right"
  single = "right"
  widgets = ["bio", "disclaimer", "social", "learningpaths", "categories", "taglist"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "dracula"
    lineNos = false

[params.logo]
  image = "img/logo/wordmark-light.svg"
  title = false
  subtitle = false

[params.style.vars]
  highlightColor = "#B7472A"