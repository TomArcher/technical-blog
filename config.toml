baseURL = "https://tomarcher.io/"
languageCode = "en-us"
title = "SIGNAL & SYNTAX: THE ENGINEERING UNDERNEATH THE MODELS"
theme = "mainroad"
ignoreFiles = ['^content/posts/.*/_private/']
googleAnalytics = "G-7ZV2PMS61P"

[pagination]
  pagerSize = 5

[params]
  readMore = true
  aboutShowAvatar = false
  avatar = "img/avatar.png"
  mainSections = ["posts"]
  description = "Tom Archer's technical blog"
  math = true

  # Short bio (first paragraph)
  bio = """
  For forty years I've built platforms, not applications. Every time I've been asked to ship a product, the product has
  turned out to be a system for generating products: a metaprogramming layer, a runtime, a configuration-driven engine
  that outlives the feature request it started from.

  At AT&T I architected Forms Express, a four-layer dynamic runtime that let non-programmers create schema-agnostic
  insurance applications. At Auto Parts International I built a state-machine platform that drove an entire distribution
  system off data-queue records. At VeriSign, my team shipped the first-ever customer self-service mobile device
  activation system, winning the 2003 SUPERQuest Award. Along the way I was a C++ MVP, authored or co-authored nine
  technology books, wrote 100+ articles for *.NET Programming Tips & Techniques*, and helped run
  [CodeGuru](http://codeguru.com) (the largest Windows developer community of its era).

  At Microsoft, I architected and built TAG (Templatized Article Generator), a production LLM orchestration platform
  that drives Azure Terraform documentation. TAG introduces a template layer where HTML-like tags encode prompt
  structures that get concatenated with code samples at runtime and routed to generative models, with results
  injected back into the output. Nearly 100 articles have shipped through the system.

  This blog is where I work through the mathematics and engineering underneath the models: from gradient descent
  to inference-time behavior, from tokenization to training infrastructure.

  Connect with me on [LinkedIn](https://www.linkedin.com/in/tom-archer-dev/).
  """

  # Load a small custom CSS file for the "READ MORE" button and separators
  customCSS = ["css/extra.css"]

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/"
    weight = 2
  [[menu.main]]
    name = "About"
    url  = "/about/"
    weight = 10
  [[menu.main]]
    #name = "Bio"
    name = "behind the code"
    url  = "/bio/"
    weight = 20

[params.social]
  github   = "https://github.com/tomarcher"
  linkedin = "https://www.linkedin.com/in/tom-archer-dev/"
  rss      = true

# Right sidebar widgets order:
[params.sidebar]
  home   = "right"
  list   = "right"
  single = "right"
  widgets = ["bio", "disclaimer", "social", "categories", "taglist"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "dracula"
    lineNos = false