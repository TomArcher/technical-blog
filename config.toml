baseURL = "https://tomarcher.io/"
languageCode = "en-us"
title = "Signal & Syntax"
theme = "mainroad"
ignoreFiles = ['^content/posts/.*/_private/']
googleAnalytics = "G-7ZV2PMS61P"

[pagination]
  pagerSize = 3

[params]
  readMore = true
  aboutShowAvatar = false
  avatar = "img/avatar.png"
  mainSections = ["posts"]
  description = "Tom Archer's technical blog"
  math = true
  opengraph = true
  twitter_cards = true
  schema = true

  # Short bio (first paragraph)
  bio = """
  My focus is the engineering beneath modern AI systems. After several years of building applications with AI through APIs, my interests have moved below that abstraction layer: understanding how models are architected, trained, evaluated, and served, why they're designed the way they are, and the engineering tradeoffs behind those decisions.

  That direction follows a pattern across my forty-year career as a software developer. I've primarily built applications, but I've repeatedly found myself pushing beyond the application itself and building the systems, abstractions, and tooling behind it: metaprogramming layers, dynamic runtimes, configuration-driven engines, and automation platforms designed to outlive the original feature request.

  The pattern shows across my career: Forms Express at AT&T, a four-layer dynamic runtime shipped for under $500K against a $2M consulting bid; VeriSign's first-ever customer self-service mobile activation system, which won the 2003 SUPERQuest Award; and TAG at Microsoft, a production LLM orchestration platform that shipped nearly 100 Terraform articles by parsing XML templates, routing prompts to Azure OpenAI, and composing results with browser-driven Azure portal capture. Along the way: C++ MVP, nine technology books, 100+ articles for .NET Programming Tips & Techniques, and helping run CodeGuru, the largest Windows developer community of its era.

  After 21 years at Microsoft, I'm now full-time on what's next: completing my Master's in Computer Science and publishing at Signal & Syntax, where I research and write about the mathematics and engineering underneath modern AI. I use mathematical models, experiments, and small implementations to explore everything from gradient descent and attention to inference-time behavior and training infrastructure; not just how to use these systems through an API, but how the machinery beneath that API actually works.

  Connect with me on [LinkedIn](https://www.linkedin.com/in/tom-archer-dev/).
  """

  # Load a small custom CSS file for the "READ MORE" button and separators
  customCSS = ["css/extra.css"]

[taxonomies]
  category = "categories"
  learningPath = "learningPaths"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/"
    weight = 2
  [[menu.main]]
    name = "Roadmap"
    url  = "/posts/roadmap/"
    weight = 5
  [[menu.main]]
    name = "About"
    url  = "/about/"
    weight = 10
  [[menu.main]]
    #name = "Bio"
    name = "behind the code"
    url  = "/bio/"
    weight = 20

[params.social]
  github   = "https://github.com/tomarcher"
  linkedin = "https://www.linkedin.com/in/tom-archer-dev/"
  rss      = true

# Right sidebar widgets order:
[params.sidebar]
  home   = "right"
  list   = "right"
  single = "right"
  widgets = ["bio", "disclaimer", "social", "learningpaths", "categories", "taglist"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "dracula"
    lineNos = false

[params.logo]
  image = "img/logo/wordmark-light.svg"
  title = false
  subtitle = false

[params.style.vars]
  highlightColor = "#B7472A"